
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Hidden Biosphere</title>
</head>

<body>
  <header>
    <div class="header-inner">
      <img class="logo" src="../assets/Logo.png" alt="Hidden Biosphere Logo">

      <div class="doc_list">
        <button
          type="button"
          class="doc_list_link"
          id="openReferences"
          aria-label="参考文献・出典を開く"
          aria-haspopup="dialog"
          aria-controls="references-modal"
        >
          <img
            class="doc_list_icon"
            src="../assets/doc_list_icon.svg"
            alt=""
          >
          <p>参考文献・出典</p>
        </button>
      </div>
    </div>
  </header>

  <main class="content">
    <!-- Deadwood -->
    <a class="habitat-card habitat-card-deadwood" href="../Deadwood_contentSelectionPage/index.html">
      <img src="../assets/Deadwood/Deadwood_selectionPage.png" alt="倒木">
      <div class="card-text">
        <h1>倒木</h1>
        <p>とうぼく</p>
      </div>
    </a>

    <!-- Under Rock -->
    <a class="habitat-card habitat-card-underrock" href="../Rock_contentSelectionPage/index.html">
      <img src="../assets/Rock/Rock_selectionPage.png" alt="岩の下">
      <div class="card-text">
        <h1>岩の下</h1>
        <p>いわのした</p>
      </div>
    </a>

    <!-- River -->
    <a class="habitat-card habitat-card-river" href="#">
      <img src="../assets/River/River_selectionPage.png" alt="川の中">
      <div class="card-text">
        <h1>川の中</h1>
        <p>かわのなか</p>
      </div>
    </a>
  </main>

  <!-- 참고문헌 팝업 -->
  <div
    id="references-modal"
    class="references-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="references-title"
    aria-hidden="true"
  >
    <div class="references-overlay"></div>

    <div class="references-panel" tabindex="-1">
      <div class="references-header">
        <h2 id="references-title">参考文献・出典</h2>

        <button
          type="button"
          class="references-close"
          id="closeReferences"
          aria-label="閉じる"
        >×</button>
      </div>

      <div class="references-list" id="referencesList">
        <!-- JavaScript에서 참고문헌 생성 -->
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
