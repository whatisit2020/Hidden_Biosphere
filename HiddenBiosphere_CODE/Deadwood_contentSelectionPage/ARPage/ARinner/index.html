<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Hidden Biosphere AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

  <!-- AR.js NFT -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <link rel="stylesheet" href="./style.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- AR 데이터 로딩 화면 -->
  <div class="arjs-loader">
    <div>Loading AR data...</div>
  </div>

  <!-- 뒤로가기 -->
  <a
    href="../index.html"
    class="back"
    aria-label="戻る"
  >
    <img
      src="../../../assets/white_arrowSymbol.svg"
      alt=""
    >
  </a>

  <!-- AR 장면 -->
  <a-scene
    vr-mode-ui="enabled: false"
    renderer="
      logarithmicDepthBuffer: true;
      precision: medium;
    "
    embedded
    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >
    <!-- 3D 모델 사전 로딩 -->
    <a-assets>
      <a-asset-item
        id="deadwood-model"
        src="../../../assets/Deadwood/3D/inner.glb"
      ></a-asset-item>

      <a-asset-item
        id="barkbeetle-model"
        src="../../../assets/Deadwood/3D/barkbeetles.glb"
      ></a-asset-item>

      <a-asset-item
        id="longhornbeetlelarva-model"
        src="../../../assets/Deadwood/3D/longhornbeetlelarvae.glb"
      ></a-asset-item>

      <a-asset-item
        id="weevillarva-model"
        src="../../../assets/Deadwood/3D/weevillarva.glb"
      ></a-asset-item>
    </a-assets>

    <!-- AR 카메라 -->
    <a-entity
      camera
      look-controls="enabled: false"
      ar-touch-raycaster
    ></a-entity>

    <!-- NFT 이미지 마커 -->
    <a-nft
      id="deadwood-marker"
      type="nft"
      url="../../../assets/Deadwood/ImageTrackingAnchor/nft/Deadwood"
      emitevents="true"
      smooth="true"
      smoothCount="20"
      smoothTolerance="0.01"
      smoothThreshold="10"
    >

      <!-- 전체 모델 조작 루트 -->
      <a-entity
        id="scene-root"
        position="200 -40 -100"
        rotation="0 180 0"
        scale="40 40 40"
      >
        <!-- 고사목 -->
        <a-entity
          id="deadwood-object"
          gltf-model="#deadwood-model"
        ></a-entity>

        <!-- bark beetle -->
        <a-entity
          id="barkbeetle-object"
          gltf-model="#barkbeetle-model"
        ></a-entity>

        <a-box
          id="barkbeetle-hitbox"
          class="clickable"
          data-part="barkbeetle"
          position="0.1 2.8 -0.7"
          scale="0.5 0.5 0.5"
          material="
            transparent: true;
            opacity: 0.4;
            color: blue;
            depthWrite: false;
          "
        ></a-box>

        <!-- weevil larva -->
        <a-entity
          id="weevillarva-object"
          gltf-model="#weevillarva-model"
        ></a-entity>

        <a-box
          id="weevillarva-hitbox"
          class="clickable"
          data-part="weevillarva"
          position="1 2.3 -1.5"
          scale="0.5 0.5 0.5"
          material="
            transparent: true;
            opacity: 0.4;
            color: red;
            depthWrite: false;
          "
        ></a-box>

        <!-- long horn beetle larva -->
        <a-entity
          id="longhornbeetlelarva-object"
          gltf-model="#longhornbeetlelarva-model"
        ></a-entity>

        <a-box
          id="longhornbeetlelarva-hitbox"
          class="clickable"
          data-part="longhornbeetlelarva"
          position="-1.3 2.4 -1.2"
          scale="1 0.5 0.5"
          material="
            transparent: true;
            opacity: 0.4;
            color: green;
            depthWrite: false;
          "
        ></a-box>
      </a-entity>
    </a-nft>
  </a-scene>
  <!-- 중앙 터치 안내 가이드 -->
  <div class="touch-guide" aria-hidden="true">
    <div class="touch-guide-frame">
      <span class="touch-guide-corner top-left"></span>
      <span class="touch-guide-corner top-right"></span>
      <span class="touch-guide-corner bottom-left"></span>
      <span class="touch-guide-corner bottom-right"></span>

      <span class="touch-guide-center"></span>
    </div>

    <p class="touch-guide-text">
      見たい対象を中央に合わせてタップしてください
    </p>
  </div>

  <!-- 오른쪽 위 도감 아이콘 -->
  <button
    id="encyclopedia-button"
    class="encyclopedia-button"
    type="button"
    aria-label="生物図鑑を開く"
    aria-hidden="true"
  >
    <img src="../../../assets/Deadwood/EncyclopediaPage/encyclopedia.png" alt="encyclopedia">
  </button>

  <!-- 간단 설명창 -->
  <div
    id="info-panel"
    class="info-panel"
    aria-hidden="true"
  >
    <div class="info-card">
      <button
        id="info-close"
        class="info-close"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>

      <p
        id="info-category"
        class="info-category"
      ></p>

      <h2
        id="info-title"
        class="info-title"
      ></h2>

      <p
        id="info-description"
        class="info-description"
      ></p>
    </div>
  </div>

  <!-- 도감 팝업 -->
  <div
    id="encyclopedia-modal"
    class="encyclopedia-modal"
    aria-hidden="true"
  >
    <section
      class="encyclopedia-book"
      aria-labelledby="encyclopedia-title"
    >
      <button
        id="encyclopedia-close"
        class="encyclopedia-close"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>

      <!-- 도감 상단 -->
      <header class="encyclopedia-header">
        <div class="encyclopedia-heading">
          <p id="encyclopedia-subtitle">
            微小生態系の
          </p>

          <h2 id="encyclopedia-title">
            昆虫
          </h2>
        </div>

        <!-- 벌레 장식 -->
        <div
          class="encyclopedia-symbol bug"
          aria-hidden="true"
        >
          <img src="../../../assets/Deadwood/EncyclopediaPage/bug.svg" alt="">
        </div>

        <!-- 유충 장식 -->
        <div
        class="encyclopedia-symbol larva"
        aria-hidden="true">
        <img src="../../../assets/Deadwood/EncyclopediaPage/larva.svg" alt="">
      </div>

      </header>

      <!-- JavaScript가 생물 카드를 생성 -->
      <div
        id="encyclopedia-grid"
        class="encyclopedia-grid"
      ></div>

      <!-- JavaScript가 페이지 점을 생성 -->
      <div
        id="encyclopedia-pagination"
        class="encyclopedia-pagination"
        aria-label="図鑑ページ"
      ></div>
    </section>
  </div>

  <!-- 개별 생물 상세 팝업 -->
  <div
    id="species-modal"
    class="species-modal"
    aria-hidden="true"
  >
    <article class="species-card">
      <button
        id="species-close"
        class="species-close"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>

      <img
        id="species-image"
        class="species-image"
        src=""
        alt=""
      >

      <p
        id="species-category"
        class="species-category"
      ></p>

      <h2
        id="species-name"
        class="species-name"
      ></h2>

      <p
        id="species-scientific-name"
        class="species-scientific-name"
      ></p>

      <p
        id="species-description"
        class="species-description"
      ></p>
    </article>
  </div>

  <script src="./script.js"></script>
</body>
</html>
