<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Decomposition Process</title>
</head>

<body>
  <main class="decomposition-page">

    <a href="../index.html" class="back" aria-label="戻る">
      <img src="../../assets/green_arrowSymbol.svg" alt="">
    </a>

    <section class="stage-info">
      <h1 id="stage-title"></h1>
      <p id="stage-time"></p>
      <p id="stage-state"></p>
      <p id="stage-expression"></p>
    </section>

    <section class="stage-visual">
      <img
        id="stage-image"
        src="../../assets/dummy1.png"
        alt="第1段階の倒木"
      >
    </section>

    <section class="stage-controller">
      <div class="stage-numbers" aria-hidden="true">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
      </div>

      <input
        id="stage-slider"
        type="range"
        min="1"
        max="5"
        step="1"
        value="1"
        aria-label="倒木の分解段階"
      >
    </section>

  </main>

  <script src="./script.js"></script>
</body>
</html>
